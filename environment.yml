name: actg175_rai
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # responsibleai 0.34.0 requires numpy<=1.26.2 AND pandas<2.0.0
  - numpy=1.26.2
  - pandas=1.5.3
  - scikit-learn=1.5.1
  - scipy=1.11.4
  - statsmodels=0.13.5
  - matplotlib=3.9.1
  - seaborn=0.13.2
  - jupyterlab=4.2.4
  - ipywidgets=8.1.3
  - ipykernel
  - pip
  - pip:
      - responsibleai==0.34.0
      - raiwidgets==0.34.0
      - raiutils==0.4.2
      - erroranalysis==0.5.5
      - interpret-community==0.32.0
      - interpret-core==0.6.9
      - dice-ml==0.11
      - fairlearn==0.7.0
      - econml==0.15.1
      - ucimlrepo==0.0.7   # optional; CSV is in data/
